interface_seed:
  schema_version: 2
  mode: se3_static
  random_seed: 42

  fragments:
    left:
      source: examples/rfd3_mosaic/lhd101_c3/inputs/7mwr_interface.pdb
      selection: A/165-194/*
      entity_type: protein
      role: interface_motif
      fixed_atoms: all
    right:
      source: examples/rfd3_mosaic/lhd101_c3/inputs/7mwr_interface.pdb
      selection: B/211-241/*
      entity_type: protein
      role: interface_motif
      fixed_atoms: all

  motion_groups:
    primary_seed:
      members: [left, right]
      mode: rigid

  ports:
    left_port:
      group: primary_seed
      fragments: [left]
      atoms: heavy
      frame: {method: reference_interface_pca}
    right_port:
      group: primary_seed
      fragments: [right]
      atoms: heavy
      frame: {method: reference_interface_pca}

  symmetry:
    transform_sets:
      assembly_d2:
        type: dihedral
        order: 2
        axis: [0.0, 0.0, 1.0]
        secondary_axis: [1.0, 0.0, 0.0]
        center: [0.0, 0.0, 0.0]
    orbits:
      primary_orbit:
        transform_set: assembly_d2
        master_groups: [primary_seed]

  interfaces:
    reference_interface:
      left_port: left_port
      right_port: right_port
      copy_relation: {orbit_offset: 0}
      required: true
      target_geometry:
        mode: reference_transform
        from_reference_seed: true
        translation_tolerance: 2.0
        rotation_tolerance_deg: 10.0

  scaffold_links:
    protomer:
      from_endpoint: {fragment: right, terminus: C}
      to_endpoint: {fragment: left, terminus: N}
      length: {minimum: 70, maximum: 100}
      tie_group: protomer_length
      chain_break: false
      copy_relation: {orbit_offset: 1}

  initialization:
    primary_seed:
      center_method: interface_heavy_atom_com
      orientation: {method: fixed, rotation_deg: [0.0, 0.0, 0.0]}
      placement:
        radius: {mean: 25.0, range: 0.0}
        axial_offset: {mean: 40.0, range: 0.0}
        radial_direction: [1.0, 0.0, 0.0]
