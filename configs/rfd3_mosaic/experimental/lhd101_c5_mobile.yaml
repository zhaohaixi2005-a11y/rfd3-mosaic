interface_seed:
  schema_version: 2
  mode: se3_static
  random_seed: 42

  fragments:
    left:
      source: examples/rfd3_mosaic/lhd101_c3/inputs/7mwr_interface.pdb
      selection: A/165-194/*
      entity_type: protein
      role: interface_motif
      fixed_atoms: all

    right:
      source: examples/rfd3_mosaic/lhd101_c3/inputs/7mwr_interface.pdb
      selection: B/211-241/*
      entity_type: protein
      role: interface_motif
      fixed_atoms: all

  motion_groups:
    primary_seed:
      members:
        - left
        - right
      mode: rigid

  ports:
    left_port:
      group: primary_seed
      fragments:
        - left
      atoms: heavy
      frame:
        method: reference_interface_pca

    right_port:
      group: primary_seed
      fragments:
        - right
      atoms: heavy
      frame:
        method: reference_interface_pca

  symmetry:
    transform_sets:
      ring_c5:
        type: cyclic
        order: 5
        axis: [0.0, 0.0, 1.0]
        center: [0.0, 0.0, 0.0]

    orbits:
      primary_orbit:
        transform_set: ring_c5
        master_groups:
          - primary_seed

  interfaces:
    ring_interface:
      left_port: left_port
      right_port: right_port
      copy_relation:
        orbit_offset: 0
      required: true
      target_geometry:
        mode: reference_transform
        from_reference_seed: true
        translation_tolerance: 2.0
        rotation_tolerance_deg: 10.0
      # Experimental local refinement only.  These cumulative bounds are
      # intentionally too small to rescue a badly oriented starting pose.
      mobility:
        mode: orbit_rigid
        bounds:
          max_translation: 1.0
          max_rotation_deg: 5.0

  scaffold_links:
    protomer:
      from_endpoint:
        fragment: right
        terminus: C
      to_endpoint:
        fragment: left
        terminus: N
      length:
        minimum: 70
        maximum: 100
      tie_group: protomer_length
      chain_break: false
      copy_relation:
        orbit_offset: 1

  initialization:
    primary_seed:
      center_method: interface_heavy_atom_com
      orientation:
        method: uniform_so3
      placement:
        radius:
          mean: 36.84
          range: 7.37
        axial_offset:
          mean: 0.0
          range: 0.0
        radial_direction: [1.0, 0.0, 0.0]

  objectives:
    compact_scaffold_span:
      metric: linkers.maximum_endpoint_distance
      mode: minimize
      weight: 1.0
      scale: 25.0
    central_axis_clearance_window:
      metric: cavities.minimum_axis_clearance
      mode: range
      weight: 0.25
      scale: 5.89
      minimum: 8.84
      maximum: 20.63
