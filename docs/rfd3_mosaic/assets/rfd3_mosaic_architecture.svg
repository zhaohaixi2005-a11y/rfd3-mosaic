<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
  <title id="title">RFD3-Mosaic algorithm architecture</title>
  <desc id="desc">A four-stage architecture diagram showing design specification, assembly compilation, independent pose generation with constrained RFdiffusion3 sampling, and auditable run outputs.</desc>

  <defs>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#102A43" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#64748B"/>
    </marker>
    <marker id="arrowIndigo" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#5967D8"/>
    </marker>
    <linearGradient id="headerRule" x1="0" x2="1">
      <stop offset="0" stop-color="#2F6FED"/>
      <stop offset="0.5" stop-color="#6B63D9"/>
      <stop offset="1" stop-color="#159A8C"/>
    </linearGradient>
    <style>
      text { font-family: Inter, "IBM Plex Sans", "Segoe UI", Arial, sans-serif; fill: #172B4D; }
      .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 1.7px; fill: #64748B; }
      .figure-title { font-size: 27px; font-weight: 720; letter-spacing: -0.4px; }
      .figure-subtitle { font-size: 14px; font-weight: 450; fill: #64748B; }
      .stage-index { font-size: 11px; font-weight: 750; letter-spacing: 1.1px; }
      .stage-title { font-size: 20px; font-weight: 720; letter-spacing: -0.2px; }
      .stage-note { font-size: 12px; font-weight: 450; fill: #64748B; }
      .section-title { font-size: 13px; font-weight: 700; }
      .body { font-size: 12px; font-weight: 500; }
      .body-muted { font-size: 11px; font-weight: 500; fill: #64748B; }
      .mono { font-family: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace; font-size: 11px; font-weight: 600; }
      .chip { font-size: 10.5px; font-weight: 650; }
      .connector-label { font-size: 10px; font-weight: 700; letter-spacing: 0.9px; fill: #64748B; }
      .card { fill: #FFFFFF; stroke: #DCE3EC; stroke-width: 1; }
      .subcard { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 1; }
      .flow { fill: none; stroke: #64748B; stroke-width: 1.8; marker-end: url(#arrow); }
      .flow-indigo { fill: none; stroke: #5967D8; stroke-width: 1.8; marker-end: url(#arrowIndigo); }
      .soft-line { fill: none; stroke: #CBD5E1; stroke-width: 1.2; }
      .constraint-line { fill: none; stroke: #DF746C; stroke-width: 1.3; stroke-dasharray: 4 4; }
    </style>
  </defs>

  <rect width="1600" height="820" fill="#F7F9FC"/>

  <!-- Figure header -->
  <g id="figure_header">
    <text x="50" y="46" class="eyebrow">METHOD OVERVIEW</text>
    <text x="50" y="79" class="figure-title">Constraint-compiled symmetric assembly design</text>
    <text x="50" y="104" class="figure-subtitle">One declared design is lowered into independent assembly poses, constrained RFdiffusion3 trajectories and auditable outputs.</text>
    <rect x="50" y="123" width="1500" height="3" rx="1.5" fill="url(#headerRule)"/>
  </g>

  <!-- Main stage connectors -->
  <g id="main_connectors">
    <path d="M310 380H342" class="flow"/>
    <path d="M680 380H712" class="flow"/>
    <path d="M1220 380H1252" class="flow"/>
  </g>

  <!-- Stage 1: declared design -->
  <g id="stage_design" filter="url(#cardShadow)">
    <rect x="50" y="155" width="260" height="500" rx="20" class="card"/>
    <rect x="50" y="155" width="260" height="5" rx="2.5" fill="#2F6FED"/>
    <text x="74" y="190" class="stage-index" fill="#2F6FED">01 · DECLARE</text>
    <text x="74" y="220" class="stage-title">Design specification</text>
    <text x="74" y="242" class="stage-note">Scientific intent, not inferred architecture</text>

    <rect x="74" y="272" width="212" height="116" rx="13" fill="#F3F7FF" stroke="#D9E5FA"/>
    <text x="92" y="299" class="section-title">User design</text>
    <rect x="92" y="316" width="42" height="24" rx="6" fill="#2F6FED" opacity="0.11"/>
    <text x="113" y="332" text-anchor="middle" class="mono" fill="#2F6FED">YAML</text>
    <line x1="145" y1="320" x2="260" y2="320" stroke="#7B93B5" stroke-width="2" stroke-linecap="round"/>
    <line x1="145" y1="335" x2="238" y2="335" stroke="#B1BED0" stroke-width="2" stroke-linecap="round"/>
    <line x1="92" y1="356" x2="258" y2="356" stroke="#D0D9E6"/>
    <text x="92" y="375" class="body-muted">symmetry · components · connections</text>

    <rect x="74" y="404" width="212" height="118" rx="13" class="subcard"/>
    <text x="92" y="431" class="section-title">Structural seeds</text>
    <circle cx="102" cy="456" r="6" fill="#DF746C"/>
    <text x="118" y="460" class="body">fixed motif</text>
    <text x="258" y="460" text-anchor="end" class="mono" fill="#64748B">atom selection</text>
    <circle cx="102" cy="486" r="6" fill="#159A8C"/>
    <circle cx="114" cy="486" r="6" fill="#6B63D9"/>
    <path d="M106 486H110" stroke="#172B4D" stroke-width="2"/>
    <text x="130" y="490" class="body">supplied interface</text>
    <text x="258" y="509" text-anchor="end" class="body-muted">joint-rigid geometry</text>

    <rect x="74" y="546" width="212" height="78" rx="13" fill="#172B4D"/>
    <text x="92" y="574" class="section-title" fill="#FFFFFF">Declared contract</text>
    <text x="92" y="596" class="body" fill="#DCE6F3">what is fixed · what may move</text>
    <text x="92" y="614" class="body" fill="#DCE6F3">what must be generated</text>
  </g>

  <!-- Stage 2: compiler -->
  <g id="stage_compiler" filter="url(#cardShadow)">
    <rect x="350" y="155" width="330" height="500" rx="20" class="card"/>
    <rect x="350" y="155" width="330" height="5" rx="2.5" fill="#159A8C"/>
    <text x="374" y="190" class="stage-index" fill="#159A8C">02 · COMPILE</text>
    <text x="374" y="220" class="stage-title">Assembly compiler</text>
    <text x="374" y="242" class="stage-note">A deterministic, replayable lowering path</text>

    <rect x="374" y="272" width="282" height="64" rx="12" fill="#ECF9F6" stroke="#CDECE6"/>
    <text x="392" y="298" class="section-title">Public schema</text>
    <text x="392" y="319" class="body-muted">selectors · interfaces · generation paths</text>

    <path d="M515 336V357" class="flow"/>

    <rect x="374" y="365" width="282" height="86" rx="12" fill="#E2F5F1" stroke="#B9E2DA"/>
    <text x="392" y="393" class="section-title">Assembly IR</text>
    <text x="392" y="414" class="body-muted">component orbits and physical relations</text>
    <g transform="translate(566 394)">
      <circle cx="0" cy="0" r="7" fill="#159A8C"/>
      <circle cx="39" cy="-14" r="7" fill="#6B63D9"/>
      <circle cx="39" cy="19" r="7" fill="#2F6FED"/>
      <path d="M7-2L32-12M7 3L32 17M39-7V12" stroke="#49677C" stroke-width="1.5"/>
    </g>

    <path d="M515 451V472" class="flow"/>

    <rect x="374" y="480" width="282" height="114" rx="12" class="subcard"/>
    <text x="392" y="505" class="section-title">Executable plans</text>
    <rect x="392" y="520" width="246" height="20" rx="6" fill="#FFFFFF" stroke="#D7E0EA"/>
    <rect x="392" y="548" width="246" height="20" rx="6" fill="#FFFFFF" stroke="#D7E0EA"/>
    <rect x="392" y="576" width="246" height="20" rx="6" fill="#FFFFFF" stroke="#D7E0EA"/>
    <text x="404" y="534" class="mono">ConstraintPlan</text>
    <text x="404" y="562" class="mono">SamplingPlan</text>
    <text x="404" y="590" class="mono">Symmetry transforms</text>

    <rect x="374" y="608" width="282" height="24" rx="7" fill="#172B4D"/>
    <text x="515" y="624" text-anchor="middle" class="mono" fill="#FFFFFF">RFD3 per-pose specification</text>
  </g>

  <!-- Stage 3: independent poses and constrained diffusion -->
  <g id="stage_sampling" filter="url(#cardShadow)">
    <rect x="720" y="155" width="500" height="500" rx="20" class="card"/>
    <rect x="720" y="155" width="500" height="5" rx="2.5" fill="#6B63D9"/>
    <text x="744" y="190" class="stage-index" fill="#6B63D9">03 · SAMPLE</text>
    <text x="744" y="220" class="stage-title">Pose ensemble + RFdiffusion3</text>
    <text x="744" y="242" class="stage-note">Independent assembly hypotheses; one model load</text>

    <text x="744" y="282" class="section-title">Per-design SE(3) instantiation</text>
    <text x="1192" y="282" text-anchor="end" class="mono" fill="#6B63D9">pose_i = feasible(seed_i)</text>

    <g id="pose_ensemble">
      <rect x="744" y="298" width="136" height="92" rx="12" fill="#F8F7FF" stroke="#DDD8F4"/>
      <rect x="894" y="298" width="136" height="92" rx="12" fill="#F8F7FF" stroke="#DDD8F4"/>
      <rect x="1044" y="298" width="152" height="92" rx="12" fill="#F8F7FF" stroke="#DDD8F4"/>
      <text x="758" y="319" class="mono">design 0</text>
      <text x="908" y="319" class="mono">design 1</text>
      <text x="1058" y="319" class="mono">design N</text>

      <g transform="translate(790 352)">
        <path d="M0 20V-20M-22 8L20-8M-17-15L16 16" class="soft-line"/>
        <rect x="-15" y="-9" width="30" height="18" rx="9" fill="#159A8C" transform="rotate(-20)"/>
        <circle cx="7" cy="-5" r="4" fill="#DF746C"/>
      </g>
      <g transform="translate(944 352)">
        <path d="M0 20V-20M-22 8L20-8M-17-15L16 16" class="soft-line"/>
        <rect x="-15" y="-9" width="30" height="18" rx="9" fill="#159A8C" transform="rotate(34)"/>
        <circle cx="-6" cy="-7" r="4" fill="#DF746C"/>
      </g>
      <g transform="translate(1100 352)">
        <path d="M0 20V-20M-22 8L20-8M-17-15L16 16" class="soft-line"/>
        <rect x="-15" y="-9" width="30" height="18" rx="9" fill="#159A8C" transform="rotate(78)"/>
        <circle cx="-7" cy="6" r="4" fill="#DF746C"/>
      </g>
      <text x="1178" y="355" class="body-muted">···</text>
    </g>

    <path d="M970 390V414" class="flow-indigo"/>
    <rect x="909" y="397" width="122" height="21" rx="10.5" fill="#FFFFFF" stroke="#DDD8F4"/>
    <text x="970" y="411" text-anchor="middle" class="chip" fill="#6B63D9">multi-example input</text>

    <rect x="744" y="422" width="452" height="130" rx="15" fill="#F2F0FF" stroke="#D5CFF4"/>
    <text x="766" y="450" class="section-title">Constrained denoising loop</text>
    <text x="1174" y="450" text-anchor="end" class="mono" fill="#6B63D9">t = T … 1</text>

    <rect x="766" y="471" width="76" height="42" rx="10" fill="#FFFFFF" stroke="#CFC9EE"/>
    <rect x="884" y="471" width="154" height="42" rx="10" fill="#FFFFFF" stroke="#CFC9EE"/>
    <rect x="1080" y="471" width="94" height="42" rx="10" fill="#FFFFFF" stroke="#CFC9EE"/>
    <text x="804" y="497" text-anchor="middle" class="mono">x(t)</text>
    <text x="961" y="497" text-anchor="middle" class="body">RFD3 prediction</text>
    <text x="1127" y="497" text-anchor="middle" class="mono">x(t-1)</text>
    <path d="M842 492H876" class="flow-indigo"/>
    <path d="M1038 492H1072" class="flow-indigo"/>
    <path d="M1128 471C1128 458 1082 457 1039 457H842C811 457 804 461 804 469" fill="none" stroke="#9389D8" stroke-width="1.3" marker-end="url(#arrowIndigo)"/>

    <g id="runtime_constraints">
      <rect x="744" y="572" width="104" height="29" rx="14.5" fill="#FFF5F3" stroke="#EDB1AB"/>
      <rect x="856" y="572" width="128" height="29" rx="14.5" fill="#FFF5F3" stroke="#EDB1AB"/>
      <rect x="992" y="572" width="104" height="29" rx="14.5" fill="#FFF5F3" stroke="#EDB1AB"/>
      <rect x="1104" y="572" width="116" height="29" rx="14.5" fill="#FFF5F3" stroke="#EDB1AB"/>
      <text x="796" y="591" text-anchor="middle" class="chip" fill="#B95049">fixed motif</text>
      <text x="920" y="591" text-anchor="middle" class="chip" fill="#B95049">joint-rigid SE(3)</text>
      <text x="1044" y="591" text-anchor="middle" class="chip" fill="#B95049">exact symmetry</text>
      <text x="1162" y="591" text-anchor="middle" class="chip" fill="#B95049">scaffold guidance</text>
      <path d="M796 572V552M920 572V552M1044 572V552M1162 572V552" class="constraint-line"/>
    </g>

    <text x="744" y="628" class="body-muted">Fixed arrangements retain their declared pose; movable seeds remain rigid internally.</text>
  </g>

  <!-- Stage 4: outputs and audits -->
  <g id="stage_outputs" filter="url(#cardShadow)">
    <rect x="1260" y="155" width="290" height="500" rx="20" class="card"/>
    <rect x="1260" y="155" width="290" height="5" rx="2.5" fill="#159A8C"/>
    <text x="1284" y="190" class="stage-index" fill="#159A8C">04 · REPORT</text>
    <text x="1284" y="220" class="stage-title">Auditable outputs</text>
    <text x="1284" y="242" class="stage-note">Coordinates, contracts and review signals</text>

    <rect x="1284" y="272" width="242" height="86" rx="12" class="subcard"/>
    <text x="1302" y="299" class="section-title">Generated artifacts</text>
    <rect x="1302" y="315" width="54" height="24" rx="6" fill="#EAF1FF"/>
    <rect x="1364" y="315" width="54" height="24" rx="6" fill="#E9F8F5"/>
    <rect x="1426" y="315" width="78" height="24" rx="6" fill="#F0EDFF"/>
    <text x="1329" y="331" text-anchor="middle" class="chip">mmCIF</text>
    <text x="1391" y="331" text-anchor="middle" class="chip">JSON</text>
    <text x="1465" y="331" text-anchor="middle" class="chip">manifest</text>

    <rect x="1284" y="374" width="242" height="146" rx="12" fill="#F2FAF8" stroke="#D5EEE9"/>
    <text x="1302" y="401" class="section-title">Contract checks</text>
    <g fill="none" stroke="#159A8C" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="1311" cy="424" r="7"/><path d="M1307 424L1310 427L1315 421"/>
      <circle cx="1311" cy="448" r="7"/><path d="M1307 448L1310 451L1315 445"/>
      <circle cx="1311" cy="472" r="7"/><path d="M1307 472L1310 475L1315 469"/>
      <circle cx="1311" cy="496" r="7"/><path d="M1307 496L1310 499L1315 493"/>
    </g>
    <text x="1328" y="428" class="body">fixed geometry</text>
    <text x="1328" y="452" class="body">declared symmetry</text>
    <text x="1328" y="476" class="body">chain continuity</text>
    <text x="1328" y="500" class="body">cross-chain topology</text>

    <rect x="1284" y="536" width="242" height="88" rx="12" fill="#F8F7FC" stroke="#E5E1F1"/>
    <text x="1302" y="563" class="section-title">Scientific review</text>
    <text x="1302" y="586" class="body-muted">advisory metrics · ranking · diversity</text>
    <text x="1302" y="607" class="body-muted">HTML report · CIF archive</text>
  </g>

  <!-- Reproducibility spine -->
  <g id="provenance_spine">
    <rect x="50" y="690" width="1500" height="88" rx="18" fill="#172B4D"/>
    <text x="76" y="720" class="stage-index" fill="#8DD8CF">REPRODUCIBILITY SPINE</text>
    <text x="76" y="748" class="body" fill="#FFFFFF">Frozen configuration</text>
    <circle cx="231" cy="744" r="3" fill="#8DD8CF"/>
    <text x="252" y="748" class="body" fill="#FFFFFF">Source snapshot</text>
    <circle cx="379" cy="744" r="3" fill="#8DD8CF"/>
    <text x="400" y="748" class="body" fill="#FFFFFF">Checkpoint identity</text>
    <circle cx="552" cy="744" r="3" fill="#8DD8CF"/>
    <text x="573" y="748" class="body" fill="#FFFFFF">Pose seed</text>
    <circle cx="665" cy="744" r="3" fill="#8DD8CF"/>
    <text x="686" y="748" class="body" fill="#FFFFFF">Diffusion seed</text>
    <circle cx="811" cy="744" r="3" fill="#8DD8CF"/>
    <text x="832" y="748" class="body" fill="#FFFFFF">Replay hash</text>
    <text x="1518" y="748" text-anchor="end" class="mono" fill="#8DD8CF">design · pose · trajectory · audit</text>
  </g>
</svg>
