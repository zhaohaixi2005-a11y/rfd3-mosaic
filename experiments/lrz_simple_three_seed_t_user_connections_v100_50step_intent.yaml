schema_version: 1
kind: simple_cage_intent
name: ordinary-three-seed-user-connected-t-t50-s953

# Engineering input for the first ordinary-user tetrahedral multi-interface
# replay. Each declaration is one complete supplied A/B contact geometry;
# Mosaic may move complete seeds but may not split or re-pair either side.
input: ../examples/rfd3_mosaic/lhd101_c3/inputs/7mwr_interface.pdb
seed_layout: solve

goal:
  architecture: cage
  composition: auto
  symmetry: [T]
  subunits: {minimum: 24, maximum: 24}

interface_seeds:
  interface_alpha:
    participants: [A, B]
    selectors: {A: A/166-170/*, B: B/217-225/*}
    use: {exact: 12}
    geometry: preserve_exact
  interface_beta:
    participants: [A, B]
    selectors: {A: A/173-177/*, B: B/213-216/*}
    use: {exact: 12}
    geometry: preserve_exact
  interface_gamma:
    participants: [A, B]
    selectors: {A: A/186-193/*, B: B/234-240/*}
    use: {exact: 12}
    geometry: preserve_exact

# Two user-authoritative three-face units. Mosaic only assigns the two
# independent tetrahedral generators and solves complete-seed poses.
polymer_connections:
  - id: unit_alpha_beta_gamma_01
    from: interface_alpha.A
    to: interface_beta.B
  - id: unit_alpha_beta_gamma_02
    from: interface_beta.B
    to: interface_gamma.A
  - id: unit_gamma_beta_alpha_01
    from: interface_gamma.B
    to: interface_beta.A
  - id: unit_gamma_beta_alpha_02
    from: interface_beta.A
    to: interface_alpha.B

generation:
  length: {minimum: 10, maximum: 45}

inspection:
  contact_cutoff: 4.5
  minimum_atom_contacts: 4
  minimum_contact_residues_per_side: 2

preferences:
  diversity: medium
  component_motion: locked

resources:
  profile: v100
  memory: 120G
  cpus: 8
  walltime: "02:00:00"

output:
  root: /dss/dssfs02/lwp-dss-0001/pn57ki/pn57ki-dss-0000/haixi/runs/rfd3-mosaic
  campaign: ordinary-three-seed-user-connected-t-canary-8_12
