schema_version: 1
name: public-t-two-orbit-mobility-t50-s975
input: ../examples/rfd3_mosaic/inputs/Prism_C3_G2_fixed_motif.pdb
symmetry:
  id: T
  axis: [0.0, 0.0, 1.0]
  secondary_axis: [1.0, 0.0, 0.0]
  center: [0.0, 0.0, 0.0]

generation:
  - kind: between
    from_selector: A12-20
    to_selector: A26-37
    length: 30

# Dynamic counterpart of the closed static T gate. Each fixed fragment remains
# internally exact while its complete twelve-copy orbit may make a bounded
# rigid-body correction. This is an execution/mobility canary, not a claim of
# useful tetrahedral interface generation.
constraints:
  - kind: fixed_xyz
    selector: A12-20
    atoms: all
    coupling_group: t_mobile_orbit_alpha
    pose: &t_mobile_pose
      mode: bounded_mobile
      subspace: bounded_se3
      proposal: scaffold_objectives
      max_translation: 3.0
      max_rotation_deg: 10.0
      start_fraction: 0.05
      end_fraction: 0.75
      response: 0.2
      max_step_translation: 0.25
      max_step_rotation_deg: 1.0

  - kind: fixed_xyz
    selector: A26-37
    atoms: all
    coupling_group: t_mobile_orbit_beta
    pose: *t_mobile_pose

sampling:
  initial_poses:
    t_mobile_orbit_alpha:
      radius: {minimum: 70.0, maximum: 70.0}
      axial_offset: {minimum: 0.0, maximum: 0.0}
      radial_direction: [0.9396926, 0.3420201, 0.0]
      orientation: {method: fixed, rotation_deg: [0.0, 0.0, 0.0]}
      seed: 97501
    t_mobile_orbit_beta:
      radius: {minimum: 100.0, maximum: 100.0}
      axial_offset: {minimum: 0.0, maximum: 0.0}
      radial_direction: [0.7071068, 0.7071068, 0.0]
      orientation: {method: fixed, rotation_deg: [0.0, 0.0, 0.0]}
      seed: 97502
  timesteps: 50
  designs: 1
  seed: 975
  preset: exact_mosaic
  low_memory_mode: true
  execution_backend: explicit_all_copy
  scaffold_packing: "off"

resources:
  profile: large_gpu
  walltime: "08:00:00"

output:
  root: /path/to/rfd3-mosaic-runs
  campaign: public-t-two-orbit-mobility-t50-canary
