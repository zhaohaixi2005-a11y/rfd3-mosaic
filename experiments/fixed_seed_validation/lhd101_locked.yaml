schema_version: 1
name: lhd101-fixed-layout
task: preserve_supplied_geometry
input: ../../examples/rfd3_mosaic/lhd101_c3/inputs/7mwr_interface.pdb
symmetry:
  id: C3
  axis: [0.0, 0.0, 1.0]
  center: [0.0, 0.0, 0.0]
fixed_arrangement: locked
preferences:
  component_motion: locked
guidance:
  intra_chain_weight: 1.0
generation:
  - kind: between
    from_selector: B211-241
    to_selector: A165-194
    orbit_offset: nearest_adjacent
    length: {minimum: 70, maximum: 100}
constraints:
  - kind: fixed_xyz
    selector: A165-194
    atoms: all
    coupling_group: supplied_interface_seed
  - kind: fixed_xyz
    selector: B211-241
    atoms: all
    coupling_group: supplied_interface_seed
sampling:
  timesteps: 50
  designs: 2
  replicates_per_pose: 2
  seed: 15091500
  initial_pose:
    radius: {minimum: 20.0, maximum: 30.0}
    axial_offset: {minimum: 0.0, maximum: 0.0}
    orientation: {method: uniform_so3}
    seed: 10063
  preset: exact_mosaic
  low_memory_mode: true
  execution_backend: explicit_all_copy
  scaffold_packing: "off"
  scaffold_core_quality:
    required: false
    maximum_mean_normalized_rg: 2.60
    minimum_mean_tertiary_support_fraction: 0.50
    maximum_long_range_contact_deficit: 0.25
resources:
  profile: any_gpu
  memory: 64G
  cpus: 8
  walltime: "02:00:00"
output:
  root: /path/to/rfd3-mosaic-runs
  campaign: fixed-seed-validation-v1
