schema_version: 1
name: public-t-two-orbit-a100-s918

input: ../examples/rfd3_mosaic/inputs/Prism_C3_G2_fixed_motif.pdb
symmetry:
  id: T
  axis: [0.0, 0.0, 1.0]
  secondary_axis: [1.0, 0.0, 0.0]
  center: [0.0, 0.0, 0.0]

generation:
  - kind: between
    from_selector: A12-20
    to_selector: A26-37
    length: 85

# This is the first native polyhedral execution gate. The two selectors form
# independent static motif orbits, each reconstructed through all 12 proper
# tetrahedral rotations. It tests software transport and group closure, not a
# biological claim about tetrahedral suitability of the Prism source motif.
constraints:
  - kind: fixed_xyz
    selector: A12-20
    atoms: all
    coupling_group: t_orbit_alpha

  - kind: fixed_xyz
    selector: A26-37
    atoms: all
    coupling_group: t_orbit_beta

sampling:
  timesteps: 50
  seed: 918
  preset: exact_mosaic
  low_memory_mode: true
  execution_backend: explicit_all_copy

# Twelve explicit all-atom copies are the deliberate reference execution.
# Start on the 80 GB A100 before attempting smaller-memory profiles or the
# local-neighbourhood backend.
resources:
  profile: a100_80g

output:
  root: /path/to/rfd3-mosaic-runs
  campaign: public-t-two-orbit-canary-8_6
