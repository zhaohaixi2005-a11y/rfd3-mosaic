schema_version: 1
name: public-t-two-orbit-short-s919

input: ../examples/rfd3_mosaic/inputs/Prism_C3_G2_fixed_motif.pdb
symmetry:
  id: T
  axis: [0.0, 0.0, 1.0]
  secondary_axis: [1.0, 0.0, 0.0]
  center: [0.0, 0.0, 0.0]

generation:
  - kind: between
    from_selector: A12-20
    to_selector: A26-37
    length: 30

# Memory-oriented execution smoke: retain the same two independent exact
# tetrahedral orbits as the 85-residue A100 gate while shortening only the
# generated segment. This validates complete 12-action runtime transport on
# smaller GPUs; it does not replace the full-length scaffold-quality canary.
constraints:
  - kind: fixed_xyz
    selector: A12-20
    atoms: all
    coupling_group: t_orbit_alpha

  - kind: fixed_xyz
    selector: A26-37
    atoms: all
    coupling_group: t_orbit_beta

sampling:
  timesteps: 50
  seed: 919
  preset: exact_mosaic
  low_memory_mode: true
  execution_backend: explicit_all_copy

resources:
  profile: v100
  walltime: "04:00:00"

output:
  root: /path/to/rfd3-mosaic-runs
  campaign: public-t-two-orbit-short-smoke-8_6
