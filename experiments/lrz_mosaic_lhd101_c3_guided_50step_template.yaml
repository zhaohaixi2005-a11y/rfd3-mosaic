schema_version: 1
name: lhd101-c3-guided-template
task: preserve_supplied_geometry

# Mosaic/RFD3 reproduction of the published Ho-Yeung interface-seed design
# task.  The input and polymer construction match the 7mwr/LHD101 C3 task;
# this experiment deliberately runs Mosaic, not RFdiffusion1.
input: ../examples/rfd3_mosaic/lhd101_c3/inputs/7mwr_interface.pdb
symmetry:
  id: C3
  axis: [0.0, 0.0, 1.0]
  center: [0.0, 0.0, 0.0]

preferences:
  component_motion: free

# The supplied interface remains an exact joint-rigid constraint.  Strong
# intra-chain guidance asks each generated scaffold to form a supported
# monomer core.  This task declares no generated-interface edge, so it omits
# inter_chain_weight rather than recording a misleading inactive value.
guidance:
  intra_chain_weight: 1.0

generation:
  - kind: between
    from_selector: B211-241
    to_selector: A165-194
    orbit_offset: 1
    length: {minimum: 70, maximum: 100}

constraints:
  # A and B are the two sides of one supplied natural interface.  Their
  # shared coupling group is one joint rigid body: no internal interface
  # distance or angle is allowed to change.  The complete seed can translate
  # and rotate in full SE(3); all C3 copies are then reconstructed exactly.
  - kind: fixed_xyz
    selector: A165-194
    atoms: all
    coupling_group: supplied_interface_seed

  - kind: fixed_xyz
    selector: B211-241
    atoms: all
    coupling_group: supplied_interface_seed

sampling:
  # Match the published 50-step task while using Mosaic's exact-symmetry
  # sampler.  The campaign launcher replaces both seeds and design count for
  # every recoverable shard.
  timesteps: 50
  designs: 1
  seed: 10000
  initial_pose:
    radius: {minimum: 20.0, maximum: 30.0}
    axial_offset: {minimum: 0.0, maximum: 0.0}
    orientation: {method: uniform_so3}
    seed: 10000
  preset: exact_mosaic
  low_memory_mode: true
  execution_backend: explicit_all_copy
  # Preserve the natural LHD101 interface.  Intra-chain guidance supports a
  # compact monomer scaffold.  No generated-interface graph and no implicit
  # generated--generated repulsion are active in this supplied-interface job.
  scaffold_packing: "off"
  scaffold_core_quality:
    # Report these scale-normalized targets in the pilot.  Promote them to a
    # hard gate only after the multi-pose cohort establishes a distribution.
    required: false
    maximum_mean_normalized_rg: 2.60
    minimum_mean_tertiary_support_fraction: 0.50
    maximum_long_range_contact_deficit: 0.25

resources:
  profile: any_gpu
  memory: 120G
  cpus: 8
  walltime: "24:00:00"

output:
  root: /dss/dssfs02/lwp-dss-0001/pn57ki/pn57ki-dss-0000/haixi/runs/rfd3-mosaic
  campaign: mosaic-lhd101-c3-guided
