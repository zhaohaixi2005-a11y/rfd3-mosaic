schema_version: 1
name: public-t-multi-face-graph-v100-s924

input: ../examples/rfd3_mosaic/inputs/Prism_C3_G2_fixed_motif.pdb
symmetry:
  id: T
  axis: [0.0, 0.0, 1.0]
  secondary_axis: [1.0, 0.0, 0.0]
  center: [0.0, 0.0, 0.0]

# Both faces belong to one rigid building block. Their internal relative pose
# cannot change, while each interface edge may address a different T neighbour.
components:
  protomer_seed:
    selectors: [A12-20, A26-37]
    geometry: joint_rigid

ports:
  face_alpha:
    component: protomer_seed
    selectors: [A12-20]
  face_beta:
    component: protomer_seed
    selectors: [A26-37]

interfaces:
  - id: alpha_beta_t_neighbour
    between: [face_alpha, face_beta]
    copy_relation: {transform: T:g01}
    relation:
      mode: preserve_input
      translation_tolerance: 0.5
      rotation_tolerance_deg: 2.0

connections:
  - id: scaffold_between_faces
    from:
      component: protomer_seed
      selector: A12-20
      terminus: c
    to:
      component: protomer_seed
      selector: A26-37
      terminus: n
    length: 30

sampling:
  initial_pose:
    radius: {minimum: 80.0, maximum: 80.0}
    axial_offset: {minimum: 0.0, maximum: 0.0}
    radial_direction: [1.0, 0.0, 0.0]
    orientation: {method: uniform_so3}
    seed: 92401
  timesteps: 10
  seed: 924
  preset: exact_mosaic
  low_memory_mode: true
  execution_backend: explicit_all_copy

resources:
  profile: v100
  walltime: "02:00:00"

output:
  root: /dss/dssfs02/lwp-dss-0001/pn57ki/pn57ki-dss-0000/haixi/runs/rfd3-mosaic
  campaign: public-t-multi-face-graph-smoke-8_7
