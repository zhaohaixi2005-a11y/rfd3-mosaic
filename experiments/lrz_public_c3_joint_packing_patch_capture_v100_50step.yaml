schema_version: 1
name: public-c3-joint-packing-patch-capture-v100-t50-s949

input: ../examples/rfd3_mosaic/inputs/Prism_C3_G2_fixed_motif.pdb
symmetry: C3
task: create_symmetric_interface
fixed_arrangement: optimize_components
preferences:
  packing: balanced
  interface_area: large
  cavity: auto
  diversity: medium
  component_motion: guided

# Regression canary for the unified transaction: a quality-captured generated
# patch and the complete internally rigid motif orbit may improve packing by
# coordinated radial/axial/rotational motion, with exact symmetry projection
# and atomic rollback.
generation:
  - kind: terminal
    anchor: A12-20
    terminus: n
    length: 35
  - kind: terminal
    anchor: A12-20
    terminus: c
    length: 35

constraints:
