schema_version: 1
name: public-component-mobility-c3-v100-s908

input: ../examples/rfd3_mosaic/inputs/Prism_C3_G2_fixed_motif.pdb
symmetry:
  id: C3
  axis: [0.0, 0.0, 1.0]
  center: [0.0, 0.0, 0.0]

generation:
  - kind: between
    from_selector: A12-20
    to_selector: A26-37
    length: 85

constraints:
  - kind: fixed_xyz
    selector: A12-20
    atoms: all
    coupling_group: mobile_left
    pose:
      mode: bounded_mobile
      max_translation: 3.0
      max_rotation_deg: 10.0
      start_fraction: 0.05
      end_fraction: 0.75
      response: 0.2
      max_step_translation: 0.25
      max_step_rotation_deg: 1.0

  - kind: fixed_xyz
    selector: A26-37
    atoms: all
    coupling_group: fixed_right

sampling:
  timesteps: 50
  seed: 908
  preset: exact_mosaic
  low_memory_mode: true
  execution_backend: explicit_all_copy

resources:
  profile: v100

output:
  root: /path/to/rfd3-mosaic-runs
  campaign: public-component-mobility-canary-8_5
