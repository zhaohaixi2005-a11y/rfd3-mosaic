schema_version: 1
name: public-c3-locked-packing-patch-capture-v100-t50-s948

input: ../examples/rfd3_mosaic/inputs/Prism_C3_G2_fixed_motif.pdb
symmetry: C3
task: create_symmetric_interface
fixed_arrangement: locked
preferences:
  packing: balanced
  interface_area: large
  cavity: auto
  diversity: medium
  component_motion: locked

# Regression canary for quality-triggered generated-patch capture.  The
# complete supplied C3 motif arrangement remains immutable; only generated
# terminal regions may form the new neighbour interface.
generation:
  - kind: terminal
    anchor: A12-20
    terminus: n
    length: 35
  - kind: terminal
    anchor: A12-20
    terminus: c
    length: 35

constraints:
  - kind: fixed_xyz
    selector: A12-20

sampling:
  # Each requested design receives one independent, replayable assembly pose
  # before diffusion.  The 20--30 A radial envelope keeps adjacent C3 motif
  # centres in a reachable but non-overlapping regime; Haar SO(3) sampling
  # explores which fixed-motif face presents the generated termini to the
  # neighbour.  "locked" still means that the selected pose cannot move at
  # any diffusion timestep.
  initial_pose:
    radius: {minimum: 20.0, maximum: 30.0}
    axial_offset: {minimum: 0.0, maximum: 0.0}
    radial_direction: [1.0, 0.0, 0.0]
    orientation: {method: uniform_so3}
    seed: 70000
  timesteps: 50
  replicates_per_pose: 1
  seed: 948
  preset: exact_mosaic
  low_memory_mode: true
  execution_backend: explicit_all_copy

resources:
  profile: v100
  memory: 120G
  cpus: 8
  walltime: "02:00:00"

output:
  root: /dss/dssfs02/lwp-dss-0001/pn57ki/pn57ki-dss-0000/haixi/runs/rfd3-mosaic
  campaign: public-c3-packing-patch-capture-canary-8_12
