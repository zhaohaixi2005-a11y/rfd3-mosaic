schema_version: 1
name: public-d3-two-orbit-h100-s915

input: ../examples/rfd3_mosaic/inputs/Prism_C3_G2_fixed_motif.pdb
symmetry:
  id: D3
  axis: [0.0, 0.0, 1.0]
  secondary_axis: [1.0, 0.0, 0.0]
  center: [0.0, 0.0, 0.0]

generation:
  - kind: between
    from_selector: A12-20
    to_selector: A26-37
    length: 85

# The two selections intentionally form independent exact motif orbits.
# This is an execution canary for six D3 group actions, not a biological
# claim about the Prism input geometry.
constraints:
  - kind: fixed_xyz
    selector: A12-20
    atoms: all
    coupling_group: d3_orbit_alpha

  - kind: fixed_xyz
    selector: A26-37
    atoms: all
    coupling_group: d3_orbit_beta

sampling:
  timesteps: 50
  seed: 915
  preset: exact_mosaic
  low_memory_mode: true
  execution_backend: explicit_all_copy

resources:
  profile: h100

output:
  root: /dss/dssfs02/lwp-dss-0001/pn57ki/pn57ki-dss-0000/haixi/runs/rfd3-mosaic
  campaign: public-d3-two-orbit-canary-8_6
