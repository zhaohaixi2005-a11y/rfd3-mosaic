schema_version: 1
name: public-t-designed-interface-v100-t50-s926

input: ../examples/rfd3_mosaic/inputs/Prism_C3_G2_fixed_motif.pdb
symmetry:
  id: T
  axis: [0.0, 0.0, 1.0]
  secondary_axis: [1.0, 0.0, 0.0]
  center: [0.0, 0.0, 0.0]

# One ordinary rigid building block supplies two faces.  Its atomic geometry
# remains exact, but unlike preserve_input no existing cross-copy interface is
# claimed.  The contact edge asks the common sampler to design packing between
# generated residues on the named T-neighbour chains.
components:
  protomer_seed:
    selectors: [A12-20, A26-37]
    geometry: joint_rigid

ports:
  face_alpha:
    component: protomer_seed
    selectors: [A12-20]
  face_beta:
    component: protomer_seed
    selectors: [A26-37]

interfaces:
  - id: designed_alpha_beta_t_neighbour
    between: [face_alpha, face_beta]
    copy_relation: {transform: T:g01}
    relation:
      mode: contact
      minimum_heavy_atom_contacts: 12
      cutoff: 5.0

connections:
  - id: scaffold_between_faces
    from:
      component: protomer_seed
      selector: A12-20
      terminus: c
    to:
      component: protomer_seed
      selector: A26-37
      terminus: n
    length: 30

sampling:
  initial_pose:
    radius: {minimum: 80.0, maximum: 80.0}
    axial_offset: {minimum: 0.0, maximum: 0.0}
    radial_direction: [1.0, 0.0, 0.0]
    orientation: {method: uniform_so3}
    seed: 92601
  timesteps: 50
  seed: 926
  preset: exact_mosaic
  low_memory_mode: true
  execution_backend: explicit_all_copy

resources:
  profile: v100
  walltime: "02:00:00"

output:
  root: /path/to/rfd3-mosaic-runs
  campaign: public-t-designed-interface-canary-8_7
